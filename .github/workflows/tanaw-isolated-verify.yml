name: TANAW isolated verification

on:
  push:
    branches:
      - verify/remote-runner-workaround
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tanaw-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository baseline
        run: npm run verify
      - name: Build application
        run: npm run build

  local-supabase:
    name: Local Supabase smoke check (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci
      - name: Start local-only Supabase
        run: npx --no-install supabase start
      - name: Verify local stack reachability
        run: npm run verify:stack
      - name: Run baseline checks against local stack
        run: npm run verify
      - name: Stop local stack
        if: always()
        run: npx --no-install supabase stop || true
