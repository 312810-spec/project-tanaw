name: TANAW isolated verification

on:
  push:
    branches:
      - verify/remote-runner-workaround
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tanaw-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository baseline
        run: npm run verify
      - name: Verify SMEA evidence semantics
        run: node --experimental-strip-types --test tests/smea-indicators.test.mjs
      - name: Verify SMEA evidence readiness
        run: node --experimental-strip-types --test tests/smea-evidence-readiness.test.mjs
      - name: Verify SMEA packet readiness
        run: node --experimental-strip-types --test tests/smea-packet-readiness.test.mjs
      - name: Verify all domain regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Verify synthetic workbook source auditing
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build

  local-supabase:
    name: Local Supabase smoke check (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci
      - name: Start local-only Supabase
        run: npx --no-install supabase start --ignore-health-check > /tmp/tanaw-supabase-start.log 2>&1 || { sed -E 's/(sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]+|[a-f0-9]{64})/[REDACTED]/g' /tmp/tanaw-supabase-start.log | tail -n 50; exit 1; }
      - name: Verify local stack reachability
        run: npm run verify:stack
      - name: Verify SMEA local database constraints
        run: docker exec -i supabase_db_project-tanaw psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/smea-registry-local.sql
      - name: Verify coordinator membership permissions
        run: docker exec -i supabase_db_project-tanaw psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/school-membership-local.sql
      - name: Verify reporting cycle calendar and deadline separation
        run: docker exec -i supabase_db_project-tanaw psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/reporting-cycle-local.sql
      - name: Verify persistent submission and packet workflow
        run: docker exec -i supabase_db_project-tanaw psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/submission-workflow-local.sql
      - name: Run baseline checks against local stack
        run: npm run verify
      - name: Install isolated authenticated browser tooling
        run: npm install --prefix /tmp/tanaw-browser --no-save --package-lock=false playwright@1.56.1
      - name: Install authenticated Chromium
        run: /tmp/tanaw-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify authenticated synthetic school workflow
        env:
          TANAW_PLAYWRIGHT_MODULE: /tmp/tanaw-browser/node_modules/playwright
        run: node scripts/verify_authenticated_browser.mjs
      - name: Preserve authenticated synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanaw-authenticated-synthetic-ui
          path: artifacts/authenticated-ui/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Stop local stack
        if: always()
        run: npx --no-install supabase stop || true
