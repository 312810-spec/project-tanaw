name: TANAW fast domain checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanaw-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Domain regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all pure domain regression tests without npm install
        run: node --experimental-strip-types --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify synthetic workbook source auditing
        run: python -m unittest discover -s tests -p '*_test.py'
