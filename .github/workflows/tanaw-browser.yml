name: TANAW browser smoke and screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tanaw-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TANAW_APP_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      TANAW_PLAYWRIGHT_MODULE: /tmp/tanaw-browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install isolated browser tooling
        run: npm install --prefix /tmp/tanaw-browser --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: /tmp/tanaw-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build unconfigured preview
        run: npm run build
      - name: Check public routes and capture screenshots
        run: node scripts/verify_browser.mjs
      - name: Preserve UI verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanaw-ui-screenshots
          path: artifacts/ui/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
